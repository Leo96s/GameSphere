server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'self'; object-src 'none'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://apis.google.com https://www.gstatic.com; connect-src 'self' https://*.googleapis.com https://securetoken.googleapis.com https://identitytoolkit.googleapis.com; frame-src 'self' https://*.firebaseapp.com https://accounts.google.com; font-src 'self' data:;" always;

    # Resolução em runtime (DNS embutido do Docker) para o nginx arrancar sem DNS externo.
    resolver 127.0.0.11 valid=30s ipv6=off;

    location /api/ {
        proxy_pass http://api-prod:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /__/auth/ {
        set $firebase_auth_upstream gamesphere-9f7dc.firebaseapp.com;
        proxy_pass https://$firebase_auth_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name gamesphere-9f7dc.firebaseapp.com;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header Host gamesphere-9f7dc.firebaseapp.com;
    }

    location /__/firebase/ {
        set $firebase_auth_upstream gamesphere-9f7dc.firebaseapp.com;
        proxy_pass https://$firebase_auth_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name gamesphere-9f7dc.firebaseapp.com;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header Host gamesphere-9f7dc.firebaseapp.com;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
